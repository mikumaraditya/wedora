services:
  redis:
    image: redis:7-alpine
    container_name: wedora-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - wedora_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

volumes:
  wedora_redis_data:
